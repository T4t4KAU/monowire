[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "monowire"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "NOTICE.txt"]
description = "Layer pipeline inference for MiniMax H3"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
monowire = "monowire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.entry-points."vllm_omni.general_plugins"]
monowire_h3 = "monowire.models.h3.plugin:register"
